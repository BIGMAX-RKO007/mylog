name = "mylog"
main = "src/index.tsx"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 自定义域名与路由配置
routes = [
  { pattern = "blog.bigmax.dpdns.org", custom_domain = true }
]

# 统一身份认证中心 (myauth) 环境变量
[vars]
AUTH_HUB_URL = "https://bigmax.dpdns.org"
MYAUTH_APP_ID = "app_mylog"
MYAUTH_CLIENT_SECRET = "sec_ee78fe3728e742a4a40d825f"

# D1 关系型数据库绑定 (生产与本地通用)
[[d1_databases]]
binding = "DB"
database_name = "mylog-db"
database_id = "6f65ca18-88ba-4b4c-88c9-a2c27628456a"
migrations_dir = "migrations"

# Workers AI 绑定 (提供 Llama 3.1 与 BGE 中文嵌入向量)
[ai]
binding = "AI"

# 轻量向量数据库绑定 (用于标签语义聚类与防膨胀)
[[vectorize]]
binding = "TAG_VECTORS"
index_name = "mylog-tag-vectors"


